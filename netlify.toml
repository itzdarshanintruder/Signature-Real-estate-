[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — serve index.html for all client routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Immutable cache for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers across the site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.xano.io wss://*.xano.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
